name: Generate Contribution Snake Animation

on:
  schedule:
    # Run every 24 hours at 00:00 UTC (Avoid using * */12 * * * which triggers every minute!)
    - cron: "0 0 * * *"
  
  # Allows manual execution anytime from the Actions tab
  workflow_dispatch:
  
  # Also run on every push to main branch
  push:
    branches:
      - main

# Required permissions for GITHUB_TOKEN to push to the output branch
permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate Snake Animation SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark
            dist/ocean.svg?color_snake=orange&color_dots=#0d1117,#0e4429,#006d32,#26a641,#39d353

      - name: Deploy Output SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
